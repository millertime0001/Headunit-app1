name: Build phone app
on:
  push:
    paths: ["**.zip", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unpack the newest uploaded zip
        run: |
          Z=$(git log -1 --name-only --pretty=format: -- '*.zip' | grep -m1 '\.zip$')
          echo "Building from $Z"
          unzip -q -o "$Z" -d src
          mkdir -p src/headunit/phone-app/app/src/main/assets/hu
          cp -r src/headunit/web/. src/headunit/phone-app/app/src/main/assets/hu/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Build
        working-directory: src/headunit/phone-app
        run: gradle assembleDebug --no-daemon
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp src/headunit/phone-app/app/build/outputs/apk/debug/app-debug.apk HeadUnitLink.apk
          V=$(cat src/headunit/VERSION)
          gh release create "app-${{ github.run_number }}" HeadUnitLink.apk --title "Head Unit Link (head unit $V)" --notes "Install HeadUnitLink.apk on the phone."
